name: Build Single S3 Mini

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "assets/**"
      - "tools/**"
      - "**/*.md"
      - "LICENSE"

  pull_request:
    paths-ignore:
      - "assets/**"
      - "tools/**"
      - "**/*.md"
      - "LICENSE"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.13"

jobs:
  build:
    name: Build ESP32-S3 SuperMini
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio
          pip install --upgrade intelhex

      - name: Full clean
        run: |
          pio run -e s3_mini -t fullclean

      # Собираем прошивку и веб-диск ТОЛЬКО для s3_mini
      - name: Build firmware & filesystem
        env:
          PIOENV: s3_mini
        run: |
          pio run -e s3_mini

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: s3_mini
          if-no-files-found: error
          path: |
            build/*.bin
            build/*.elf

  release:
    name: Release Dev
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Move dev tag
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"
          git fetch --tags
          git tag -f dev
          git push origin refs/tags/dev --force

      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          name: s3_mini
          path: artifacts

      - name: Delete old release assets
        uses: mknejp/delete-release-assets@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: dev
          fail-if-no-assets: false
          fail-if-no-release: false
          assets: |
            *.bin
            *.elf

      - name: Clear release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit dev --notes "" || gh release create dev --title "Dev (unstable)" --notes "" --prerelease || true

      - name: Publish Dev release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: dev
          name: Dev (unstable)
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: |
            artifacts/*.bin
            artifacts/*.elf
